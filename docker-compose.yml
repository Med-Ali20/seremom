services:
  db:
    image: postgres:15-alpine
    container_name: seremom-db
    restart: always
    environment:
      POSTGRES_USER: seremom_user
      POSTGRES_PASSWORD: seremom
      POSTGRES_DB: seremom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seremom_user -d seremom"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: seremom-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://seremom_user:seremom@db:5432/seremom?schema=public"
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    command: >
      sh -c "npx prisma migrate deploy --schema=prisma/schema.prisma && node dist/main.js"

volumes:
  postgres_data:
  uploads_data: